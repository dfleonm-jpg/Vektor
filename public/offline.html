<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vektor — Sin conexión</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #09090b;
        color: #fafafa;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 16px 0 4px; }
      p { color: #a1a1aa; font-size: 0.9rem; max-width: 20rem; }
      .axis { stroke: #00e5ff; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M14 16 L32 46" stroke="#fafafa" stroke-width="5" stroke-linecap="round" />
        <path d="M50 16 L32 46" stroke="#fafafa" stroke-width="5" stroke-linecap="round" />
        <line x1="32" y1="10" x2="32" y2="54" class="axis" stroke-width="2.5" stroke-linecap="round" />
      </svg>
      <h1>Sin conexión</h1>
      <p>
        Vektor funciona offline. Puedes seguir registrando tu entrenamiento; se
        sincronizará automáticamente cuando recuperes la red.
      </p>
    </div>
  </body>
</html>
